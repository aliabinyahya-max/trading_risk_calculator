name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Recreate Android Project Files
        run: flutter create . --platforms=android --org=com.tradingassistant

      - name: Configure Android Core Desugaring and NDK
        run: |
          APP_GRADLE="android/app/build.gradle"
          if [ -f "android/app/build.gradle.kts" ]; then
            APP_GRADLE="android/app/build.gradle.kts"
            sed -i '/defaultConfig {/a \        minSdk = 21\n        multiDexEnabled = true' $APP_GRADLE
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' $APP_GRADLE
            sed -i '/android {/a \    ndkVersion = "27.0.12077973"' $APP_GRADLE
            sed -i '/dependencies {/a \    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")' $APP_GRADLE
          else
            sed -i '/defaultConfig {/a \        minSdkVersion 21\n        multiDexEnabled true' $APP_GRADLE
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' $APP_GRADLE
            sed -i '/android {/a \    ndkVersion "27.0.12077973"' $APP_GRADLE
            sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' $APP_GRADLE
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
